name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    env:
      DALAMUD_HOME: ${{ github.workspace }}/artifacts/dalamud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Download stable Dalamud references
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud.zip'
          Invoke-WebRequest 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $env:DALAMUD_HOME
      - name: Build library, gallery, and tests
        run: dotnet build Diktat.slnx -c Release -p:RestoreLockedMode=true
      - name: Run contracts and native ImGui tests
        run: dotnet run --project tests/Diktat.Tests -c Release --no-build -- --native
